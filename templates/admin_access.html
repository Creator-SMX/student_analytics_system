                                    <i class="fa fa-search mr-2"></i> 搜索

                                <button id="reset-btn"
                                    class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors">

                <!-- 数据统计卡片 -->

                    <div class="bg-white rounded-lg card-shadow p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-500">今日访问总次数</p>

                    <div class="bg-white rounded-lg card-shadow p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-gray-500">今日访问人次</p>
                                <h3 class="text-3xl font-bold text-gray-800 mt-1" id="unique-users-count">0</h3>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center">
                                <i class="fa fa-users text-secondary text-xl"></i>
                            </div>
                        </div>
                        <div class="mt-4 flex items-center text-sm">

                    </div>

                        <div class="flex items-center justify-between">

                                <p class="text-sm font-medium text-gray-500">禁止通行次数</p>

                            <span class="text-danger"><i class="fa fa-arrow-up mr-1"></i>0.00%</span>
                            <span class="text-gray-500 ml-2">较昨日</span>

                </div>

                <!-- 门禁记录表格 -->
                <div class="bg-white rounded-lg card-shadow overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center">
                        <h2 class="text-lg font-semibold">门禁记录列表</h2>
                        <div class="flex space-x-2">
                            <button
                                class="px-3 py-1 border border-gray-300 text-sm rounded-md hover:bg-gray-50 transition-colors">

                    <div class="overflow-x-auto">

                                    <th scope="col"
                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        门禁卡号</th>
                                    <th scope="col"
                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        访问时间</th>

                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">

                                        访问状态</th>

                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="access-table-body">

                                <tr>
                                    <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                                        <i class="fa fa-search-minus text-3xl mb-2 block"></i>
                                        暂无数据，请调整筛选条件
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                <!-- 分页控件 -->
                <div class="flex justify-between items-center border-t px-4 py-3 sm:px-6">
                    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm text-gray-700">
                                显示第 <span class="font-medium">0</span> 至 <span class="font-medium">0</span> 条，共 <span class="font-medium">0</span> 条记录

                        </div>
                        <div id="access-pagination" class="mt-4 sm:mt-0 sm:ml-6">

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 当前页码
            let currentPage = 1;

            // 初始化页面时加载数据
            searchAccessRecords();
            // 加载今日统计数据
            loadTodayStats();
            // 加载门禁卡号列表
            loadAccessCardNumbers();

            // 搜索按钮事件
            document.getElementById('search-btn')?.addEventListener('click', function () {
                searchAccessRecords();
            });

            // 重置按钮事件
            document.getElementById('reset-btn')?.addEventListener('click', function () {
                const resetFields = ['card-no', 'date-range-start', 'date-range-end', 'access-location', 'access-type'];
                resetFields.forEach(fieldId => {
                    const field = document.getElementById(fieldId);
                    if (field) field.value = '';
                });
                searchAccessRecords();
            });

            // 加载今日统计数据
            function loadTodayStats() {
                // 获取今日门禁统计API调用
                const totalAccessCountEl = document.getElementById('total-access-count');
                const uniqueUsersCountEl = document.getElementById('unique-users-count');
                const forbiddenCountEl = document.getElementById('forbidden-count');

                // 先显示加载状态
                if (totalAccessCountEl) totalAccessCountEl.textContent = '加载中...';
                if (uniqueUsersCountEl) uniqueUsersCountEl.textContent = '加载中...';
                if (forbiddenCountEl) forbiddenCountEl.textContent = '加载中...';

                console.log('直接从数据库加载今日统计数据');

                // 调用本地API从数据库获取数据
                fetch('/api/access-stats-today')
                    .then(response => {
                        console.log('统计数据API响应状态:', response.status);
                        return response.json();
                    })
                    .then(data => {
                        console.log('统计数据API响应:', data);
                        // 处理标准格式的响应
                        if (!data.success) {
                            console.warn('统计数据获取失败:', data.error);
                            throw new Error(data.error || '获取统计数据失败');
                        }
                        const actualStats = data.data || {};
                        if (totalAccessCountEl) totalAccessCountEl.textContent = actualStats.total_access || 0;
                        if (uniqueUsersCountEl) uniqueUsersCountEl.textContent = actualStats.unique_users || 0;
                        if (forbiddenCountEl) forbiddenCountEl.textContent = actualStats.forbidden_count || 0;
                    })
                    .catch(error => {
                        console.error('获取统计数据失败:', error);
                        if (totalAccessCountEl) totalAccessCountEl.textContent = '获取失败';
                        if (uniqueUsersCountEl) uniqueUsersCountEl.textContent = '获取失败';
                        if (forbiddenCountEl) forbiddenCountEl.textContent = '获取失败';
                        alert('获取统计数据失败，请刷新页面重试');
                    });
            }

            // 日期格式化函数
            function formatDate(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString;
                return date.toISOString().split('T')[0];
            }

            // 加载门禁卡号列表
            function loadAccessCardNumbers() {
                const datalistElement = document.getElementById('card-numbers-list');

                // 清空现有选项，准备加载真实数据
                datalistElement.innerHTML = '';

                console.log('直接从数据库加载门禁卡号列表');

                // 调用本地API从数据库获取数据
                fetch('/api/access-card-numbers')
                    .then(response => {
                        console.log('门禁卡号API响应状态:', response.status);
                        return response.json();
                    })
                    .then(data => {
                        console.log('门禁卡号API响应:', data);

                        // 处理标准格式的响应
                        if (!data.success) {
                            console.warn('门禁卡号获取失败:', data.error);
                            throw new Error(data.error || '获取门禁卡号失败');
                        }

                        // 获取实际的卡号数据
                        let cardNumbers = [];
                        if (data.data && Array.isArray(data.data)) {
                            cardNumbers = data.data;
                        } else if (data && Array.isArray(data)) {
                            // 兼容旧格式
                            cardNumbers = data;
                        } else if (data && data.card_numbers && Array.isArray(data.card_numbers)) {
                            // 兼容其他可能的数据格式
                            cardNumbers = data.card_numbers;
                        }

                        // 添加门禁卡号选项
                        cardNumbers.forEach(cardNo => {
                            if (cardNo && typeof cardNo === 'string' && cardNo.trim() !== '') {
                                const option = document.createElement('option');
                                option.value = cardNo.trim();
                                datalistElement.appendChild(option);
                            }
                        });

                        console.log('成功加载门禁卡号数量:', cardNumbers.length);
                    })
                    .catch(error => {
                        console.error('获取门禁卡号失败:', error);
                        alert('获取门禁卡号失败，请刷新页面重试');
                    });
            }

            // 搜索门禁记录函数
            function searchAccessRecords(page = 1) {
                const tableBody = document.getElementById('access-table-body');
                if (!tableBody) return;

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                            <i class="fa fa-spinner fa-spin text-2xl mb-2 block"></i>
                            正在从数据库加载数据，请稍候...
                        </td>
                    </tr>
                `;

                // 获取过滤条件
                const getElementValue = (id) => {
                    const el = document.getElementById(id);
                    return el ? el.value.trim() : '';
                };

                const cardNoFilter = getElementValue('card-no');
                const addressFilter = getElementValue('access-location');
                const accessFilter = getElementValue('access-type');

                // 构建查询参数
                const params = new URLSearchParams();
                params.append('access_card_no', cardNoFilter);

                // 格式化日期范围
                const dateStart = getElementValue('date-range-start');
                const dateEnd = getElementValue('date-range-end');
                params.append('date_start', formatDate(dateStart));
                params.append('date_end', formatDate(dateEnd));

                params.append('address', addressFilter);
                params.append('access', accessFilter);
                params.append('page', page);
                params.append('per_page', 10);

                console.log('调用门禁记录API从数据库获取数据:', params.toString());

                // 添加超时处理
                const fetchWithTimeout = (url, options, timeout = 10000) => {
                    return Promise.race([
                        fetch(url, options),
                        new Promise((_, reject) =>
                            setTimeout(() => reject(new Error('请求超时')), timeout)
                        )
                    ]);
                };

                // 直接调用本地API从数据库获取数据
                fetchWithTimeout(`/api/access-records?${params.toString()}`)
                    .then(response => {
                        console.log('门禁记录API响应状态:', response.status);
                        return response.json();
                    })
                    .then(data => {
                        console.log('门禁记录API响应:', data);
                        currentPage = page;

                        // 处理标准格式的响应
                        let tableData = {};
                        if (data.success) {
                            // 获取实际的数据
                            if (data.data && typeof data.data === 'object') {
                                tableData = data.data;
                            } else {
                                // 兼容旧格式
                                tableData = data;
                            }
                            console.log('成功获取门禁记录，总数:', tableData.total || 0);
                        } else {
                            console.warn('门禁记录获取失败:', data.error);
                            tableData = { records: [], total: 0, per_page: 10, page: page };
                        }

                        updateTable(tableData);
                        updatePagination(tableData);
                    })
                    .catch(error => {
                        console.error('获取门禁记录失败:', error);

                        // 显示错误信息
                        tableBody.innerHTML = `
                            <tr>
                                <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                                    <i class="fa fa-exclamation-circle text-danger text-2xl mb-2 block"></i>
                                    <div class="mb-2">获取数据失败: ${error.message}</div>
                                    <button id="retry-btn" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">
                                        <i class="fa fa-refresh mr-2"></i>重试
                                    </button>
                                </td>
                            </tr>
                        `;

                        // 添加重试按钮事件
                        document.getElementById('retry-btn')?.addEventListener('click', function () {
                            searchAccessRecords(page);
                        });
                    });
            }

            // 更新表格数据
            function updateTable(data) {
                const tableBody = document.getElementById('access-table-body');
                const totalRecordsElement = document.getElementById('total-records');

                if (!tableBody) return;

                // 更新总记录数（安全地）
                if (totalRecordsElement) {
                    totalRecordsElement.textContent = data.total || 0;
                }

                // 处理API返回的数据结构
                const records = data.data || data.records || [];

                // 更新表格内容
                if (records.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                                暂无数据，请调整筛选条件
                            </td>
                        </tr>
                    `;
                    return;
                }

                let html = '';
                records.forEach((record) => {
                    // 处理access字段，API返回的是'允许'/'禁止'文本
                    const accessAllowed = record.access === '允许';
                    const accessTypeClass = accessAllowed ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                    const accessTypeText = record.access; // 直接使用API返回的文本

                    html += `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${record.access_card_no || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${record.date_time || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${record.address || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${accessTypeClass}">
                                    ${accessTypeText}
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${record.describe_text || record.note || '-'}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;
            }

            // 更新分页控件
            function updatePagination(data) {
                const paginationElement = document.getElementById('access-pagination');
                if (!paginationElement) return;
                
                const totalPages = data.pages || Math.ceil((data.total || 0) / 10);
                const totalRecords = data.total || 0;
                const pageSize = 10; // 每页记录数
                const startIndex = totalRecords > 0 ? (currentPage - 1) * pageSize + 1 : 0;
                const endIndex = Math.min(currentPage * pageSize, totalRecords);
                
                // 更新显示信息
                const paginationInfo = paginationElement.closest('.flex').querySelector('p');
                if (paginationInfo) {
                    paginationInfo.innerHTML = `显示第 <span class="font-medium">${startIndex}</span> 至 <span class="font-medium">${endIndex}</span> 条，共 <span class="font-medium">${totalRecords}</span> 条记录`;
                }
                
                // 更新移动端显示
                const mobileInfo = document.querySelector('.sm\\:hidden .text-sm');
                if (mobileInfo) {
                    mobileInfo.textContent = `第 ${currentPage} 页，共 ${totalPages} 页`;
                }

                let html = '';
                
                // 上一页按钮
                html += `
                    <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${currentPage === 1 ? 'pointer-events-none opacity-50' : ''}" 
                        ${currentPage === 1 ? '' : `onclick="searchAccessRecords(${currentPage - 1}); return false;"`}>
                        <span class="sr-only">上一页</span>
                        <i class="fa fa-chevron-left h-5 w-5"></i>
                    </a>
                `;
                
                // 页码按钮逻辑 - 最多显示7个页码
                const maxVisiblePages = 7;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
                let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
                
                // 调整起始页码，确保显示最大数量的页码
                if (endPage - startPage + 1 < maxVisiblePages) {
                    startPage = Math.max(1, endPage - maxVisiblePages + 1);
                }
                
                // 显示第一页和省略号（如果需要）
                if (startPage > 1) {
                    html += `
                        <a href="#" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50" onclick="searchAccessRecords(1); return false;">
                            1
                        </a>
                    `;
                    if (startPage > 2) {
                        html += `
                            <span class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">
                                ...
                            </span>
                        `;
                    }
                }
                
                // 显示当前范围内的页码
                for (let i = startPage; i <= endPage; i++) {
                    html += `
                        <a href="#" class="relative inline-flex items-center px-4 py-2 border ${currentPage === i ? 'bg-primary text-white border-primary' : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50'} text-sm font-medium" onclick="searchAccessRecords(${i}); return false;">
                            ${i}
                        </a>
                    `;
                }
                
                // 显示最后一页和省略号（如果需要）
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        html += `
                            <span class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">
                                ...
                            </span>
                        `;
                    }
                    html += `
                        <a href="#" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50" onclick="searchAccessRecords(${totalPages}); return false;">
                            ${totalPages}
                        </a>
                    `;
                }
                
                // 下一页按钮
                html += `
                    <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${currentPage === totalPages ? 'pointer-events-none opacity-50' : ''}" 
                        ${currentPage === totalPages ? '' : `onclick="searchAccessRecords(${currentPage + 1}); return false;"`}>
                        <span class="sr-only">下一页</span>
                        <i class="fa fa-chevron-right h-5 w-5"></i>
                    </a>
                `;

                paginationElement.innerHTML = html;
            }

            // 暴露给全局，用于分页按钮点击
            window.searchAccessRecords = searchAccessRecords;

            // 页面加载时自动执行一次搜索，加载默认的数据
            window.addEventListener('load', function () {
                // 延迟执行，确保DOM完全加载
                setTimeout(() => {
                    loadTodayStats();
                    loadAccessCardNumbers();
                    searchAccessRecords(1);
                }, 100);
            });
        });
    </script>
</body>

</html>
