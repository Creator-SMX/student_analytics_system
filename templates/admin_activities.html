<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有活动记录 - 学生消费行为分析系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#52C41A',
                        warning: '#FAAD14',
                        error: '#F5222D',
                        info: '#36CFC9',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            }
            .sidebar-item-active {
                color: #165DFF;
                background-color: rgba(22, 93, 255, 0.1);
                border-right: 3px solid #165DFF;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fa fa-bar-chart text-primary text-2xl mr-3"></i>
                        <span class="text-xl font-semibold text-gray-800">学生消费行为分析系统</span>
                    </div>
                </div>
                <div class="flex items-center">
                    <button type="button" class="p-2 rounded-full text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none">
                        <i class="fa fa-bell text-lg"></i>
                    </button>
                    <div class="ml-4 relative">
                        <div>
                            <button type="button" class="flex items-center max-w-xs rounded-full text-sm focus:outline-none" id="user-menu-button">
                                <img class="h-8 w-8 rounded-full" src="https://via.placeholder.com/40" alt="管理员头像">
                                <span class="ml-2 hidden md:block text-sm font-medium text-gray-700">管理员</span>
                                <i class="fa fa-chevron-down ml-1 text-xs text-gray-400"></i>
                            </button>
                        </div>
                        <!-- 下拉菜单 -->
                        <div class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 hidden" id="user-menu">
                            <div class="py-1" role="menu" aria-orientation="vertical">
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">
                                    <i class="fa fa-user mr-2"></i>个人资料
                                </a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">
                                    <i class="fa fa-cog mr-2"></i>设置
                                </a>
                                <button onclick="handleLogout()" class="w-full text-left block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">
                                    <i class="fa fa-sign-out mr-2"></i>退出登录
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- 侧边导航栏 -->
        <aside class="w-64 bg-white shadow-sm overflow-y-auto flex-shrink-0">
            <nav class="px-4 py-4">
                <div class="space-y-1">
                    <a href="/admin/dashboard" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                        <i class="fa fa-dashboard w-5 h-5 mr-3 text-gray-500"></i>
                        <span>仪表盘</span>
                    </a>
                    <a href="/admin/activities" class="flex items-center px-3 py-2 text-sm font-medium rounded-md sidebar-item-active">
                        <i class="fa fa-list-alt w-5 h-5 mr-3 text-primary"></i>
                        <span>活动记录</span>
                    </a>
                    <a href="/admin/students" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                        <i class="fa fa-users w-5 h-5 mr-3 text-gray-500"></i>
                        <span>学生管理</span>
                    </a>
                    <a href="/admin/statistics" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                        <i class="fa fa-bar-chart w-5 h-5 mr-3 text-gray-500"></i>
                        <span>统计分析</span>
                    </a>
                </div>

                <div class="mt-8">
                    <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">系统管理</p>
                    <div class="mt-2 space-y-1">
                        <a href="/admin/settings" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-cog w-5 h-5 mr-3 text-gray-500"></i>
                            <span>系统设置</span>
                        </a>
                        <a href="/admin/logs" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-100">
                            <i class="fa fa-file-text w-5 h-5 mr-3 text-gray-500"></i>
                            <span>操作日志</span>
                        </a>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- 主内容区域 -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-6">
            <div class="max-w-7xl mx-auto">
                <!-- 页面标题 -->
                <div class="mb-6">
                    <div class="flex items-center">
                        <a href="/admin/dashboard" class="text-gray-500 hover:text-primary mr-3">
                            <i class="fa fa-arrow-left"></i>
                        </a>
                        <h1 class="text-2xl font-bold text-gray-900">所有活动记录</h1>
                    </div>
                    <p class="mt-1 text-sm text-gray-500">所有学生的消费和充值记录，按时间从近到远排序</p>
                </div>

                <!-- 筛选和搜索 -->
                <div class="bg-white rounded-xl p-4 mb-6 card-shadow">
                    <div class="flex flex-col md:flex-row md:items-center gap-4">
                        <div class="flex-1">
                            <div class="relative rounded-md shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa fa-search text-gray-400"></i>
                                </div>
                                <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-primary focus:border-primary sm:text-sm" placeholder="搜索学生姓名、学号或位置...">
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <select id="activityTypeFilter" class="block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                                <option value="all">全部类型</option>
                                <option value="消费">消费</option>
                                <option value="充值">充值</option>
                            </select>
                            <button id="filterButton" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-150">
                                <i class="fa fa-filter mr-2"></i>筛选
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 活动记录表格 -->
                <div class="bg-white rounded-xl p-6 card-shadow">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">学生姓名</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">学号</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">专业</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">活动类型</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">金额</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">时间</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">地点</th>
                                </tr>
                            </thead>
                            <tbody id="activitiesTableBody" class="bg-white divide-y divide-gray-200">
                                <!-- 数据将通过JavaScript动态加载 -->
                                <tr>
                                    <td colspan="6" class="px-6 py-20 text-center text-gray-500">
                                        <div class="animate-spin mb-4">
                                            <i class="fa fa-circle-o-notch fa-spin text-3xl text-primary"></i>
                                        </div>
                                        <p>加载活动记录中...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- 分页控件 -->
                    <div class="flex items-center justify-between px-4 py-3 sm:px-6 mt-4">
                        <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                            <div>
                                <p class="text-sm text-gray-700">
                                    显示 <span class="font-medium">1</span> 到 <span class="font-medium">20</span> 条，共 <span class="font-medium">42</span> 条记录
                                </p>
                            </div>
                            <div>
                                <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                                    <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                        <span class="sr-only">上一页</span>
                                        <i class="fa fa-chevron-left text-xs"></i>
                                    </a>
                                    <a href="#" aria-current="page" class="z-10 bg-primary text-white relative inline-flex items-center px-4 py-2 border border-primary text-sm font-medium">1</a>
                                    <a href="#" class="bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium">2</a>
                                    <a href="#" class="bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium">3</a>
                                    <span class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">...</span>
                                    <a href="#" class="bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium">10</a>
                                    <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                        <span class="sr-only">下一页</span>
                                        <i class="fa fa-chevron-right text-xs"></i>
                                    </a>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-4">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500">
            <p>© 2024 学生消费行为分析系统 - 管理员控制台</p>
        </div>
    </footer>

    <script>
        // 用户下拉菜单
        document.getElementById('user-menu-button').addEventListener('click', function() {
            const menu = document.getElementById('user-menu');
            menu.classList.toggle('hidden');
        });

        // 点击其他地方关闭下拉菜单
        document.addEventListener('click', function(event) {
            const button = document.getElementById('user-menu-button');
            const menu = document.getElementById('user-menu');
            if (!button.contains(event.target) && !menu.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });

        // 退出登录处理
        async function handleLogout() {
            try {
                const response = await fetch('/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    window.location.href = '/login';
                } else {
                    alert('退出失败，请稍后重试');
                }
            } catch (error) {
                console.error('退出登录失败:', error);
                alert('退出失败，请稍后重试');
            }
        }

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch('/auth/check_login');
                const result = await response.json();
                
                if (!result.logged_in || result.user_type !== 'admin') {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                window.location.href = '/login';
            }
        }

        // 从API获取所有活动记录数据
        async function generateAllActivities() {
            try {
                // 显示加载中状态
                const tbody = document.getElementById('activitiesTableBody');
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center"><div class="flex justify-center items-center"><div class="animate-spin mr-2"></div>加载活动记录数据...</div></td></tr>';
                
                // 获取筛选参数
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const activityType = document.getElementById('activityTypeFilter').value;
                
                // 构建API请求URL
                let url = '/api/activities?page=1&per_page=100'; // 获取足够多的数据用于前端筛选
                if (activityType && activityType !== 'all') {
                    url += `&activity_type=${encodeURIComponent(activityType)}`;
                }
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('API请求失败');
                }
                
                const data = await response.json();
                
                // 处理API返回的数据
                const activities = data.map(item => {
                    // 从描述中提取卡号，格式为"学生 card_no 在..."
                    const cardNoMatch = item.description.match(/学生\s+(\d+)\s+/);
                    const cardNo = cardNoMatch ? cardNoMatch[1] : '未知';
                    
                    // 从API返回的数据中获取专业信息（如果有）
                    const major = item.major || '未知专业';
                    
                    // 从描述中提取地点信息
                    let location = '未知';
                    if (item.description.includes('在')) {
                        const parts = item.description.split('在');
                        if (parts.length > 1) {
                            // 提取地点信息
                            let locationPart = parts[1];
                            // 移除金额信息（如果有）
                            if (locationPart.includes('消费了')) {
                                locationPart = locationPart.split('消费了')[0];
                            }
                            location = locationPart.trim();
                            // 确保location不为空
                            if (!location) location = '未知';
                        }
                    }
                    
                    return {
                        studentId: cardNo,
                        major: major,
                        type: item.type,
                        amount: item.amount,
                        time: item.date_time,
                        location: location
                    };
                });
                
                // 如果有搜索词，进行前端筛选
                if (searchTerm) {
                    return activities.filter(activity => {
                        return activity.studentId.includes(searchTerm) ||
                               activity.location.toLowerCase().includes(searchTerm);
                    });
                }
                
                return activities;
            } catch (error) {
                console.error('获取活动记录数据失败:', error);
                return [];
            }
        }

        // 渲染活动记录表格
        function renderActivitiesTable(activities) {
            const tbody = document.getElementById('activitiesTableBody');
            tbody.innerHTML = '';
            
            if (activities.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-20 text-center text-gray-500">暂无活动记录</td></tr>';
                return;
            }
            
            activities.forEach(activity => {
                // 根据活动类型设置不同的标签颜色
                const tagClass = activity.type === '消费' ? 
                    'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800';
                
                // 格式化金额，避免非数字类型导致的错误
                const amount = parseFloat(activity.amount) || 0;
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors duration-150';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">学生${activity.studentId}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${activity.studentId}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${activity.major}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${tagClass}">${activity.type}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm ${activity.type === '消费' ? 'text-red-600' : 'text-green-600'}">
                        ${activity.type === '消费' ? '-' : '+'}¥${amount.toFixed(2)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-600">${activity.time}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${activity.location}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 筛选功能
        async function filterActivities() {
            try {
                const activities = await generateAllActivities();
                renderActivitiesTable(activities);
            } catch (error) {
                console.error('筛选活动记录失败:', error);
                document.getElementById('activitiesTableBody').innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">筛选失败，请刷新页面重试</td></tr>';
            }
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            
            // 延迟加载数据以显示加载动画
            setTimeout(async () => {
                try {
                    const allActivities = await generateAllActivities();
                    renderActivitiesTable(allActivities);
                } catch (error) {
                    console.error('初始化加载数据失败:', error);
                    document.getElementById('activitiesTableBody').innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">加载失败，请刷新页面重试</td></tr>';
                }
            }, 500);
            
            // 添加筛选事件监听
            document.getElementById('filterButton').addEventListener('click', filterActivities);
            document.getElementById('searchInput').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    filterActivities();
                }
            });
        });
    </script>
</body>
</html>
